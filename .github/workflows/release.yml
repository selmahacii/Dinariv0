name: Build & Release APK

# Se déclenche quand on pousse un tag "v..." (ex: git tag v1.0.1 && git push --tags)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # google-services.json est requis pour compiler (plugin FlutterFire).
      # Il est déjà présent dans le repo (projet de démo chatapp-d6ae5).
      # Pour un projet client : le stocker en secret base64 et le restaurer ici.
      - name: Restore google-services.json (optionnel)
        if: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json

      # Signature de release (optionnelle) : ajouter les secrets du dépôt
      #   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS
      # Sinon le build est signé avec la clé debug (installable pour du test).
      - name: Restore release keystore (optionnel)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > dinari-release.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../../dinari-release.jks
          EOF

      - run: flutter pub get

      - run: flutter build apk --release --split-per-abi

      - name: Rename artifacts
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do mv "$f" "Dinari-${GITHUB_REF_NAME}-${f#app-}"; done
          ls -la

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/Dinari-*.apk
          generate_release_notes: true
