name: Build & Release APK

# Se déclenche quand on pousse un tag "v..." (ex: git tag v1.0.1 && git push --tags)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      # Signé avec la clé debug (installable pour du test).
      # Pour signer avec la vraie clé : committer android/key.properties + le .jks
      # via des secrets, ou builder en local (voir DEPLOYMENT.md).
      - run: flutter build apk --release --split-per-abi

      - name: Rename artifacts
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do mv "$f" "Dinari-${GITHUB_REF_NAME}-${f#app-}"; done
          ls -la

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/Dinari-*.apk
          generate_release_notes: true
