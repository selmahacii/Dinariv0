name: Build & Release APK

# Se déclenche quand on pousse un tag "v..." (ex: git tag v1.0.1 && git push --tags)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "platform-tools"
          yes | sdkmanager --licenses || true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9

      - run: flutter --version
      - run: flutter pub get

      # Signé avec la clé debug (installable pour du test).
      # Pour signer avec la vraie clé de release : ajouter les secrets du dépôt
      #   KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_PASSWORD / KEY_ALIAS
      # et restaurer android/key.properties + le .jks ici (voir DEPLOYMENT.md).
      - run: flutter build apk --release --split-per-abi

      - name: Rename artifacts
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do mv "$f" "Dinari-${GITHUB_REF_NAME}-${f#app-}"; done
          ls -la

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/Dinari-*.apk
          generate_release_notes: true
